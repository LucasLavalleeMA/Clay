name: Release

# Started by publish-release.ps1 (gh workflow run) or manually from the Actions tab.
# Version comes from Directory.Build.props; the tag is created by the release job.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      msi_version: ${{ steps.v.outputs.msi_version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Directory.Build.props
        id: v
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $prefix = ($props.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ } | Select-Object -First 1)
          $suffix = ($props.Project.PropertyGroup | ForEach-Object { $_.VersionSuffix } | Where-Object { $_ } | Select-Object -First 1)
          if (-not $prefix) { throw 'VersionPrefix not found in Directory.Build.props' }
          $version = $prefix.Trim()
          if ($suffix) { $version = "$version-$($suffix.Trim())" }
          "version=$version"                      | Out-File $env:GITHUB_OUTPUT -Append
          "msi_version=$($prefix.Trim())"         | Out-File $env:GITHUB_OUTPUT -Append  # MSI versions must be numeric
          "tag=v$version"                         | Out-File $env:GITHUB_OUTPUT -Append
          "prerelease=$([bool]$suffix)".ToLower() | Out-File $env:GITHUB_OUTPUT -Append

      - name: Fail early if the tag already exists
        shell: pwsh
        run: |
          $hit = git ls-remote --tags origin "refs/tags/${{ steps.v.outputs.tag }}"
          if ($hit) { throw "Tag ${{ steps.v.outputs.tag }} already exists. Bump the version in Directory.Build.props." }

  build:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false   # a broken architecture shouldn't hide the others' results
      matrix:
        include:
          - { arch: x64,   rid: win-x64 }
          - { arch: x86,   rid: win-x86 }
          - { arch: ARM64, rid: win-arm64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MSI_VERSION: ${{ needs.prepare.outputs.msi_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # One publish per architecture, shared by the portable zip AND the installer.
      - name: Publish app (${{ matrix.rid }})
        shell: pwsh
        run: |
          dotnet publish .\Clay.csproj -c Release -p:PublishProfile=portable-${{ matrix.rid }} -o "${{ github.workspace }}\artifacts\publish\${{ matrix.rid }}"
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }

      - name: Zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "artifacts\publish\${{ matrix.rid }}\*" -DestinationPath "dist\Clay-$env:VERSION-portable-${{ matrix.rid }}.zip"

      - name: Build MSI
        shell: pwsh
        run: |
          $out = "${{ github.workspace }}\artifacts\installer\${{ matrix.rid }}\"
          dotnet build .\Installer\Clay.Installer.wixproj -c Release `
            -p:Platform=${{ matrix.arch }} `
            -p:ProductVersion=$env:MSI_VERSION `
            -p:PublishDir="${{ github.workspace }}\artifacts\publish\${{ matrix.rid }}" `
            -p:SkipPublish=true `
            -p:OutputPath=$out
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }

      - name: Build bootstrapper EXE
        shell: pwsh
        run: |
          $out = "${{ github.workspace }}\artifacts\installer\${{ matrix.rid }}\"
          dotnet build .\Installer\Clay.Bundle.wixproj -c Release `
            -p:Platform=${{ matrix.arch }} `
            -p:ProductVersion=$env:MSI_VERSION `
            -p:MsiPath="${out}ClayInstaller.msi" `
            -p:OutputPath=$out
          if ($LASTEXITCODE -ne 0) { throw 'Bundle build failed' }

      - name: Collect release files
        shell: pwsh
        run: |
          $roots = @("artifacts\installer\${{ matrix.rid }}", "dist\installer\${{ matrix.arch }}") | Where-Object { Test-Path $_ }
          function Find-One($name) {
            $hit = $roots | ForEach-Object { Get-ChildItem $_ -Recurse -Filter $name -File } | Select-Object -First 1
            if (-not $hit) {
              Get-ChildItem -Recurse artifacts, dist -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -Auto
              throw "Missing $name for ${{ matrix.rid }}"
            }
            $hit.FullName
          }
          Copy-Item (Find-One 'ClaySetup.exe')     "dist\Clay-$env:VERSION-setup-${{ matrix.rid }}.exe"
          Copy-Item (Find-One 'ClayInstaller.msi') "dist\Clay-$env:VERSION-${{ matrix.rid }}.msi"
          Get-ChildItem dist -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]   # only runs if every architecture built
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub release
        shell: pwsh
        run: |
          # Release notes = matching "## [version]" section of CHANGELOG.md
          $notes = $null
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $pattern = '^##\s+\[' + [regex]::Escape($env:VERSION) + '\]'
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match $pattern) { $start = $i + 1; break } }
            if ($start -ge 0) {
              $body = @()
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s+\[' -or $lines[$i] -match '^\[[^\]]+\]:\s') { break }
                $body += $lines[$i]
              }
              $notes = ($body -join "`n").Trim()
            }
          }

          $ghArgs = @('release', 'create', $env:TAG) + (Get-ChildItem dist -File | ForEach-Object FullName) + @(
            '--target', $env:GITHUB_SHA,
            '--title', "Clay $env:VERSION"
          )
          if ($notes) { Set-Content notes.md $notes -Encoding UTF8; $ghArgs += @('--notes-file', 'notes.md') }
          else        { $ghArgs += '--generate-notes' }
          if ($env:PRERELEASE -eq 'true')       { $ghArgs += '--prerelease' }
          if ('${{ inputs.draft }}' -eq 'true') { $ghArgs += '--draft' }

          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
